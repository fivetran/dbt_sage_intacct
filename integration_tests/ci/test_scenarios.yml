schema_variable_name: "sage_intacct_schema"

include_databricks_sql: false
include_sqlserver: false
include_duckdb: true
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "invoices disabled bills disabled"
    vars:
      sage_intacct__using_invoices: false
      sage_intacct__using_bills: false
    include_incremental: false

  - name: "invoices disabled bills enabled"
    vars:
      sage_intacct__using_invoices: false
      sage_intacct__using_bills: true
    include_incremental: false

  - name: "invoices enabled bills disabled"
    vars:
      sage_intacct__using_invoices: true
      sage_intacct__using_bills: false
    include_incremental: false

  - name: "MDLS"
    vars:
      fivetran_using_source_casing: true
    include_incremental: false
    include_dbt_seed: true
