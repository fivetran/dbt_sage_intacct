version: 1.5.0
pr_number: 51
new_features:
- description: Raises the minimum supported dbt version from v1.3.0 to v1.10.0.
under_the_hood:
- description: Adds `dbt_utils.unique_combination_of_columns` tests to the staging and end models. The tests use the `arguments` syntax introduced in dbt v1.10.0, the new minimum supported version.
- description: Documents eight fields in the `stg_sage_intacct__gl_detail` model that
    the model already outputs but the yml did not describe.
  details:
  - Adds descriptions for `class_id`, `class_name`, `currency`, `department_id`, `department_title`,
    `location_id`, `location_name`, and `pr_description`.
  - These fields are unchanged in the model output. Only the documentation was missing,
    so your dbt docs now describe the full set of columns the model returns.
