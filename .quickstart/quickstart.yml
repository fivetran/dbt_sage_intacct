database_key: sage_intacct_database
schema_key: sage_intacct_schema

dbt_versions: ">=1.3.0 <3.0.0"

table_variables:
  sage_intacct__using_invoices:
    - ar_invoice
    - ar_invoice_item
  sage_intacct__using_bills:
    - ap_bill
    - ap_bill_item

destination_configurations:
  databricks:
    dispatch:
      - macro_namespace: dbt_utils
        search_order: [ 'spark_utils', 'dbt_utils' ]

public_models: [
  "sage_intacct__ap_ar_enhanced",
  "sage_intacct__general_ledger_by_period",
  "sage_intacct__profit_and_loss",
  "sage_intacct__balance_sheet",
  "sage_intacct__general_ledger"
]

supported_vars:
  sage_account_pass_through_columns:
    type: list
    description: "Additional `GL_ACCOUNT` columns to include in `sage_intacct__general_ledger` and `sage_intacct__general_ledger_by_period`"
    display_name: "Additional GL Account Columns"

  sage_gl_pass_through_columns:
    type: list
    description: "Additional `GL_DETAIL` columns to include in `sage_intacct__general_ledger`"
    display_name: "Additional GL Detail Columns"

